services:
  - type: web
    name: northpoint-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SUPERADMIN_REGISTER_KEY
        generateValue: true
      - key: MONITORING_POLICY_VERSION
        value: "1"
      - key: ACTIVITY_RETENTION_DAYS
        value: "90"
